[project]
name = "autofile"
version = "0.2024.0"
description = "Filesystem database manager for AutoMech"
readme = "README.md"
dependencies = []
requires-python = ">= 3.11"

[dependency-groups]
test = ["pytest"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Hatchling configurations
[tool.hatch.build.targets.whell]
packages = ["src/autofile"]

# Pixi configurations
[tool.pixi.workspace]
channels = ["conda-forge", "Auto-Mech"]
platforms = ["linux-64"]
preview = ["pixi-build"]

#   - Build
[tool.pixi.package] 
name = "autofile"

[tool.pixi.package.build] 
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.host-dependencies] 
hatchling = "==1.26.3"

[tool.pixi.package.run-dependencies] 
numpy = ">=1.26"
pyyaml = ">=6.0.3"
autochem = ">=2025.10.0"
autoio = ">=2025.10.0"

#   - Environments
[tool.pixi.pypi-dependencies]
autofile = { path = ".", editable = true }

[tool.pixi.dependencies]
numpy = ">=1.26"
pyyaml = ">=6.0.3"
autochem = ">=2025.10.0"
autoio = ">=2025.10.0"

[tool.pixi.feature.build.dependencies]
rattler-build = ">=0.47.1"
bumpver = ">=2025.1131,<2026"

[tool.pixi.environments]
test = ["test"]
build = ["build"]

#   - Tasks
[tool.pixi.feature.test.tasks]
test = "pytest -v src/autofile"

[tool.pixi.feature.build.tasks]
upload = "rattler-build upload anaconda -o Auto-Mech *.conda"
current-version = "bumpver show -n | awk -F': ' '/Current Version: / {print $2}'"

[tool.bumpver]
current_version = "0.2024.0"
version_pattern = "MAJOR.YYYY.PATCH"
commit_message = "Release {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = "scripts/update_lockfile.sh"
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/autofile/__init__.py" = [
    '__version__ = "{version}"',
]
