name: version

on:
  push:
    branches: [ dev ]

permissions:
  contents: write

jobs:
  version:
    if: github.repository_owner == 'Auto-Mech'
    runs-on: ubuntu-latest
    steps:
      # Repository
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # BumpVer needs tags

      # Environment
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.9

      - name: Bump version
        run: |
          pixi run -e build bumpver update
